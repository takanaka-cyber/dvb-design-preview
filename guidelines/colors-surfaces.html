<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--background);"></div><div class="lbl"><b>--background</b>ページ</div></div><div class="sw"><div class="chip" style="background:var(--card);"></div><div class="lbl"><b>--card</b>カード・入力</div></div><div class="sw"><div class="chip" style="background:var(--muted);"></div><div class="lbl"><b>--muted</b>thead・行ホバー</div></div><div class="sw"><div class="chip" style="background:var(--border);"></div><div class="lbl"><b>--border</b>罫線</div></div>
</div></body></html>
