<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--chart-1);"></div><div class="lbl"><b>--chart-1</b>青</div></div><div class="sw"><div class="chip" style="background:var(--chart-2);"></div><div class="lbl"><b>--chart-2</b>ティール</div></div><div class="sw"><div class="chip" style="background:var(--chart-3);"></div><div class="lbl"><b>--chart-3</b>琥珀</div></div><div class="sw"><div class="chip" style="background:var(--chart-4);"></div><div class="lbl"><b>--chart-4</b>ローズ</div></div><div class="sw"><div class="chip" style="background:var(--chart-5);"></div><div class="lbl"><b>--chart-5</b>スレート</div></div>
</div></body></html>
