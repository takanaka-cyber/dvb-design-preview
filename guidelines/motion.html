<!-- @dsCard group="Spacing" viewport="700x110" subtitle="モーションは1種。reduced-motion で 0ms" name="Motion" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><div class="row" style="gap:24px;align-items:center">
<div><div style="height:36px;width:120px;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:500;transition:background var(--duration) var(--ease)" onmouseenter="this.style.background='var(--primary-hover)'" onmouseleave="this.style.background='var(--primary)'">hover で色だけ</div></div>
<div class="lbl"><b>--duration 150ms · --ease cubic-bezier(.2,0,0,1)</b>色・不透明度・高さのみ。移動・拡大・バウンス・グラデ影は使わない。<br>@media (prefers-reduced-motion: reduce) で --duration: 0ms</div>
</div></body></html>
