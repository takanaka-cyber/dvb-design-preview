<!-- @dsCard group="Colors" viewport="700x150" subtitle=".dark の同名トークン。エイリアスなしで両値を持つ" name="Dark mode" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><div class="dark" style="background:var(--background);padding:16px;border-radius:var(--radius);color:var(--foreground)">
<div class="row">
<div class="sw"><div class="chip" style="background:var(--card);border-color:var(--border)"></div><div class="lbl" style="color:var(--muted-foreground)"><b style="color:var(--foreground)">--card</b></div></div>
<div class="sw"><div class="chip" style="background:var(--primary);display:grid;place-items:center;color:var(--primary-foreground);font-weight:600">保存</div><div class="lbl" style="color:var(--muted-foreground)"><b style="color:var(--foreground)">--primary</b>#60A5FA</div></div>
<div class="sw"><div class="chip" style="background:var(--positive-subtle);color:var(--positive-subtle-foreground);display:grid;place-items:center;font-variant-numeric:tabular-nums">▲ +12.3%</div><div class="lbl" style="color:var(--muted-foreground)"><b style="color:var(--foreground)">--positive-subtle</b></div></div>
<div class="sw"><div class="chip" style="background:var(--negative-subtle);color:var(--negative-subtle-foreground);display:grid;place-items:center;font-variant-numeric:tabular-nums">▼ −4.1pt</div><div class="lbl" style="color:var(--muted-foreground)"><b style="color:var(--foreground)">--negative-subtle</b></div></div>
</div></div></body></html>
