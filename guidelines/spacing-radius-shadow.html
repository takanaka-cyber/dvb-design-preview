<!-- @dsCard group="Spacing" viewport="700x130" subtitle="角丸 8px 基準、影は1段" name="Radius & shadow" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><div class="row" style="gap:16px">
<div class="sw"><div class="chip" style="border-radius:var(--radius-sm);background:var(--muted)"></div><div class="lbl"><b>--radius-sm 6px</b>小ボタン・チップ</div></div>
<div class="sw"><div class="chip" style="border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow-card)"></div><div class="lbl"><b>--radius 8px + --shadow-card</b>カード（唯一の影）</div></div>
<div class="sw"><div class="chip" style="border-radius:var(--radius);background:var(--card)"></div><div class="lbl"><b>--radius 8px</b>入力・ボタン・ダイアログ</div></div>
<div class="sw"><div class="chip" style="border-radius:var(--radius-full);background:var(--rank-a);width:56px;margin:auto"></div><div class="lbl" style="text-align:center"><b>--radius-full</b>ピル・アバター</div></div>
</div></body></html>
