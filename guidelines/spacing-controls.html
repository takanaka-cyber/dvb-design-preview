<!-- @dsCard group="Spacing" viewport="700x120" subtitle="操作部品の高さ 36 / 32" name="Control heights" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><style>.c{height:36px;border:1px solid var(--input);border-radius:var(--radius);padding:0 12px;display:inline-flex;align-items:center;background:var(--card);font-size:14px}.p{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);font-weight:500}.s{height:32px;font-size:13px;padding:0 10px;border-radius:var(--radius-sm)}</style>
<div class="row" style="gap:8px;align-items:center">
<span class="c" style="color:var(--disabled-foreground);width:180px">案件を検索…</span><span class="c">今週（9/7〜9/13）</span><span class="c p">保存</span>
<span class="c s" style="margin-left:16px">フィルタ</span><span class="c s p">追加</span>
</div>
<div class="lbl" style="margin-top:8px"><b>--control-height 36px / --control-height-sm 32px</b>Input・Select・Button は同じ高さ。ボタン最小幅 64px</div></body></html>
