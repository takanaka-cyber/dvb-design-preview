<!-- @dsCard group="Colors" viewport="700x120" subtitle="ランク S→停止。青系 強→弱、停止は無彩" name="Rank labels" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><style>.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-full);font-size:12px;font-weight:600;border:1px solid transparent}</style>
<div class="row" style="gap:12px;align-items:center">
<span class="pill" style="background:var(--rank-s);color:var(--rank-s-foreground)">S</span>
<span class="pill" style="background:var(--rank-a);color:var(--rank-a-foreground)">A</span>
<span class="pill" style="background:var(--rank-b);color:var(--rank-b-foreground);border-color:var(--rank-b-border)">B</span>
<span class="pill" style="background:var(--rank-c);color:var(--rank-c-foreground);border-color:var(--rank-c-border)">C</span>
<span class="pill" style="background:var(--rank-stop);color:var(--rank-stop-foreground)">停止</span>
<span class="pill" style="background:var(--card);color:var(--muted-foreground);border-color:var(--border);border-style:dashed">未設定</span>
</div>
<div class="lbl" style="margin-top:10px">--rank-s 塗り / --rank-a 薄塗り / --rank-b 青枠 / --rank-c 灰枠 / --rank-stop 灰塗り / 未設定は破線枠（トークンなし、--border）</div></body></html>
