<!-- @dsCard group="Colors" viewport="700x130" subtitle="ブランドは青1色。hover と subtle の3値だけ" name="Primary" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--primary);"></div><div class="lbl"><b>--primary</b>#2563EB 白文字 5.2:1</div></div><div class="sw"><div class="chip" style="background:var(--primary-hover);"></div><div class="lbl"><b>--primary-hover</b>#1D4ED8</div></div><div class="sw"><div class="chip" style="background:var(--primary-subtle);"></div><div class="lbl"><b>--primary-subtle</b>選択行・現在地</div></div>
<div class="sw"><div class="chip" style="background:var(--primary-subtle);color:var(--primary-subtle-foreground);display:grid;place-items:center;font-weight:500">現在地</div><div class="lbl"><b>--primary-subtle-foreground</b>subtle 上の文字</div></div>
</div></body></html>
