<!-- @dsCard group="Colors" viewport="700x190" subtitle="正負・警告・情報。文字色と薄背景をセットで" name="Status" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:90px}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--border)}.lbl{font-size:12px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}.lbl b{display:block;color:var(--foreground);font-weight:500;font-family:var(--font-mono);font-size:12px}</style></head><body><style>.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.b{border-radius:var(--radius);padding:10px 12px}.n{font-variant-numeric:tabular-nums;font-weight:500}</style>
<div class="st">
<div class="b" style="background:var(--positive-subtle);color:var(--positive-subtle-foreground)">完了 <span class="n">▲ +12.3%</span></div>
<div class="b" style="background:var(--negative-subtle);color:var(--negative-subtle-foreground)">遅れ <span class="n">▼ −4.1pt</span></div>
<div class="b" style="background:var(--warning-subtle);color:var(--warning-subtle-foreground)">未完了 3件</div>
<div class="b" style="background:var(--info-subtle);color:var(--info-subtle-foreground)">対象週の数値なし</div>
<div class="lbl"><b>--positive(-subtle)</b>#15803D / #F0FDF4</div><div class="lbl"><b>--negative(-subtle)</b>#DC2626 / #FEF2F2</div><div class="lbl"><b>--warning(-subtle)</b>#B45309 / #FFFBEB</div><div class="lbl"><b>--info(-subtle)</b>= primary 系</div>
</div>
<div class="lbl" style="margin-top:12px">文字色だけで使う例: <span class="n" style="color:var(--positive)">▲ +¥120,400</span> <span class="n" style="color:var(--negative);margin-left:12px">▼ −¥38,200</span> <span style="margin-left:12px">金額本体は --foreground、色は増減だけ</span></div></body></html>
