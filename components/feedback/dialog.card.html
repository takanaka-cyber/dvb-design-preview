<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { Dialog, Field, Input, Select } = await ready(["Dialog","Button","Field","Input","Select"]);
const App = () => (
  <div className="c">
    <span className="k">sm 480 — 1 入力</span>
    <Dialog inline size="sm" title="カテゴリを追加" confirmLabel="追加"><Field label="カテゴリ名" htmlFor="c"><Input id="c" placeholder="例: 事務" /></Field></Dialog>

      <div style={{ display: "grid", gap: 12 }}>
        <Field label="タイトル" htmlFor="t"><Input id="t" defaultValue="C社 縦型 15 秒 撮影" /></Field>

      </div>
    </Dialog>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
