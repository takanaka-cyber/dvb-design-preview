<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script type="importmap">{"imports":{"react":"../../assets/react-shim.js"}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/lucide-react-shim.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" data-type="module" src="../core/Icon.jsx"></script>
<script type="text/babel" data-type="module" src="./Badge.jsx"></script>
<script type="text/babel" data-type="module" src="./ConfirmDialog.jsx"></script>
<script type="text/babel" data-type="module" src="./Toast.jsx"></script>
<style>body{padding:16px;background:var(--card)}.g{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;align-items:center}.k{font-size:12px;color:var(--muted-foreground)}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { Badge, ConfirmDialog, Toast } = await ready(["Badge","ConfirmDialog","Toast"]);
const App = () => (
  <div className="g">
    <span className="k">rank</span><div className="r">{["S","A","B","C","停止",null].map((v,i)=><Badge key={i} kind="rank" value={v}/>)}</div>
    <span className="k">media</span><div className="r">{["FB","TikTok","Google","その他"].map(v=><Badge key={v} kind="media" value={v}/>)}</div>
    <span className="k">status</span><div className="r"><Badge value="todo"/><Badge value="done"/><Badge value="late" label="1件遅れ"/><Badge value="info" label="対象週の数値なし"/><Badge value="neutral" label="未設定"/></div>
    <span className="k">assignee / count</span><div className="r"><Badge kind="assignee" value="白井"/><Badge kind="assignee" value="髙仲 秀介"/><Badge kind="count" value={12}/><Badge kind="count" value="4/4件"/></div>
    <span className="k">ConfirmDialog</span><div><ConfirmDialog inline title="タスクを削除しますか？" description="「A社 記事LP の CR 差し替え」が削除されます。この操作は取り消せません。" /></div>
    <span className="k">Toast</span><div style={{display:"grid",gap:8}}><Toast kind="success" message="保存しました" /><Toast kind="undo" message="タスクを完了にしました" actionLabel="元に戻す" /><Toast kind="error" message="保存できませんでした。もう一度お試しください" /></div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
