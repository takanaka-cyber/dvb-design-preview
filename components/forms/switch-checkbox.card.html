<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script type="importmap">{"imports":{"react":"../../assets/react-shim.js"}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/lucide-react-shim.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" data-type="module" src="./Switch.jsx"></script>
<script type="text/babel" data-type="module" src="./Checkbox.jsx"></script>
<style>body{padding:16px;background:var(--card)}.g{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;align-items:center}.k{font-size:12px;color:var(--muted-foreground)}.r{display:flex;gap:24px;align-items:center;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { Switch, Checkbox } = await ready(["Switch","Checkbox"]);
function Sw(p){ const [v,setV]=React.useState(!!p.on); return <Switch {...p} checked={v} onChange={setV}/>; }
function Cb(p){ const [v,setV]=React.useState(!!p.on); return <Checkbox {...p} checked={v} onChange={setV}/>; }
const App = () => (
  <div className="g">
    <span className="k">Switch</span><div className="r"><Sw on label="未完了だけ表示"/><Sw label="通知を受け取る"/><Sw on disabled label="無効（ON）"/><Sw size="sm" on/></div>
    <span className="k">Checkbox</span><div className="r"><Cb on label="Meta 広告マネージャの権限を確認"/><Cb label="Chatwork ルームに招待"/><Checkbox indeterminate label="すべて選択（一部）"/><Cb disabled label="無効"/></div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
