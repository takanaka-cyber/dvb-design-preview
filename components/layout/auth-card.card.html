<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script type="importmap">{"imports":{"react":"../../assets/react-shim.js"}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/lucide-react-shim.js"></script>

</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { AuthCard, Button, Input, Field } = await ready(["AuthCard","Button","Input","Field"]);
const big = { height: 44, fontSize: 16 };
const Form = () => (<>
  <Field label="メールアドレス" htmlFor="e"><Input id="e" type="email" defaultValue="okura@example.com" style={{}} /></Field>
  <Field label="パスワード" htmlFor="p"><Input id="p" type="password" defaultValue="********" /></Field>
  <Button variant="primary" block>ログイン</Button>
</>);
const App = () => (
  <div className="g">
    <AuthCard description="デイリー業務一元管理システム" footer={<span>アカウントをお持ちでない方は <a href="#">登録申請</a></span>}><Form /></AuthCard>
    <AuthCard description="デイリー業務一元管理システム" error="メールアドレスまたはパスワードが違います" footer={<span>アカウントをお持ちでない方は <a href="#">登録申請</a></span>}><Form /></AuthCard>
    <AuthCard icon="Lock" iconTone="negative" title="アクセスできません" description="このリンクは無効か、有効期限が切れています。担当者に再発行を依頼してください。" />
    <AuthCard icon="CircleCheck" iconTone="positive" title="申請完了" description="管理者が承認するとログインできます。承認はチャットワークで通知されます。"><Button variant="secondary" block>ログイン画面に戻る</Button></AuthCard>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
