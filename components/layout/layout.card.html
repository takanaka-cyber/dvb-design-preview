<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script type="importmap">{"imports":{"react":"../../assets/react-shim.js"}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/lucide-react-shim.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" data-type="module" src="../core/Icon.jsx"></script>
<script type="text/babel" data-type="module" src="../core/Button.jsx"></script>
<script type="text/babel" data-type="module" src="../forms/Select.jsx"></script>
<script type="text/babel" data-type="module" src="./PageHeader.jsx"></script>
<script type="text/babel" data-type="module" src="./FilterBar.jsx"></script>
<script type="text/babel" data-type="module" src="./SectionHeading.jsx"></script>
<script type="text/babel" data-type="module" src="./EmptyState.jsx"></script>
<script type="text/babel" data-type="module" src="./Sidebar.jsx"></script>
<style>body{padding:16px;background:var(--card)}.g{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;align-items:center}.k{font-size:12px;color:var(--muted-foreground)}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { Button, Select, PageHeader, FilterBar, SectionHeading, EmptyState, Sidebar } = await ready(["Button","Select","PageHeader","FilterBar","SectionHeading","EmptyState","Sidebar"]);
const groups = [
  { label:"毎日", items:[{key:"dash",label:"ダッシュボード",icon:"LayoutDashboard"},{key:"tasks",label:"タスク管理",icon:"ListChecks",badge:3},{key:"mbo",label:"日報",icon:"BookOpen"}] },
  { label:"週次", items:[{key:"weekly",label:"週次レポート",icon:"BarChart3"},{key:"board",label:"GG 週次案件ボード",icon:"Table2"},{key:"projects",label:"案件別まとめ",icon:"FolderKanban"}] },
  { label:"目標・評価", items:[{key:"commit",label:"コミットメント",icon:"Target",badge:1,badgeTone:"negative"},{key:"goal",label:"目標",icon:"Flag"}] },
];
function Nav(){ const [c,setC]=React.useState(false); const [a,setA]=React.useState("board"); return <div style={{display:"flex",gap:16,height:420}}><Sidebar groups={groups} activeKey={a} onSelect={setA} collapsed={c} onToggle={()=>setC(!c)} date="9/8 (火)" time="15:56" user={{name:"髙仲 秀介",role:"リーダー"}}/><Sidebar groups={groups} activeKey="mbo" collapsed date="9/8 (火)" time="15:56" user={{name:"髙仲 秀介"}}/></div>; }
function Chips(){ const [s,setS]=React.useState(["白井"]); const names=["白井","井上","髙仲","佐藤"]; return <FilterBar period="今週（9/7〜9/13）" chips={names.map(n=>({label:n,active:s.includes(n)}))} onChip={n=>setS(s.includes(n)?s.filter(x=>x!==n):[...s,n])} right={<Button size="sm" icon="Download">CSV</Button>}><Select options={["全ランク","S","A","B","C","停止"]} defaultValue="全ランク"/><Select options={["全状態","未完了","完了"]} defaultValue="全状態"/></FilterBar>; }
const App = () => (
  <div className="g">
    <span className="k">PageHeader</span><div><PageHeader icon="FolderKanban" title="案件別まとめ" description="担当案件の実績・検証CP・週次施策をまとめて確認"><Button icon="ExternalLink">シートを開く</Button><Button variant="primary" icon="Plus">タスクを追加</Button></PageHeader></div>
    <span className="k">FilterBar</span><div><Chips/></div>
    <span className="k">SectionHeading</span><div style={{display:"grid",gap:12}}><SectionHeading icon="FlaskConical" title="検証CP結果" count={3} description="白井 × 1CP"><Button size="sm" variant="ghost" icon="ArrowUpDown">並べ替え</Button></SectionHeading><SectionHeading level={3} icon="ListChecks" title="今週のタスク" count={0}/></div>
    <span className="k">EmptyState</span><div style={{border:"1px solid var(--border)",borderRadius:"var(--radius)",background:"var(--card)"}}><EmptyState icon="ListChecks" title="今週のタスクはまだありません。" description="下の入力欄から追加できます。" action={<Button variant="primary" size="sm" icon="Plus">タスクを追加</Button>}/></div>
    <span className="k">EmptyState guide</span><div><EmptyState variant="guide" title="週次案件ボードの使い方" description="週の初めに3つだけ。" steps={["対象週と担当者を選ぶ","粗利増減の大きい案件から順にタスクを1行ずつ追加","金曜に完了チェックを付けて送信"]} action={<Button variant="primary" icon="Plus">最初のタスクを追加</Button>}/></div>
    <span className="k">Sidebar 248 / 56</span><div><Nav/></div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
