<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script type="importmap">{"imports":{"react":"../../assets/react-shim.js"}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { SegmentedControl } = await ready(["SegmentedControl"]);
function Demo({ options }) { const [v, setV] = React.useState(typeof options[0] === "string" ? options[0] : options[0].value); return <SegmentedControl options={options} value={v} onChange={setV} aria-label="表示" />; }
const App = () => (
  <div className="g">
    <span className="k">2 個</span><div className="r"><Demo options={["月", "週"]} /></div>
    <span className="k">3 個（並び替え）</span><div className="r"><Demo options={["優先度", "期限", "案件"]} /></div>
    <span className="k">4 個</span><div className="r"><Demo options={["全て", "ダッシュボード表示のみ", "案件別", "優先度別"]} /></div>
    <span className="k">アイコン付き 6 個</span><div className="r"><Demo options={[{value:"chat",label:"Q&A",icon:"MessageSquare"},{value:"check",label:"チェックリスト",icon:"ListChecks"},{value:"lec",label:"講義",icon:"BookOpen"},{value:"book",label:"課題",icon:"FileText"},{value:"val",label:"バリュー",icon:"Heart"},{value:"cr",label:"CR",icon:"Image"}]} /></div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
