<!-- @dsCard group="Components" viewport="700x720" subtitle="KpiCard / MetricCell / DataTable / TaskRow" name="Data" -->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script type="importmap">{"imports":{"react":"../../assets/react-shim.js"}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/lucide-react-shim.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" data-type="module" src="../core/Icon.jsx"></script>
<script type="text/babel" data-type="module" src="./KpiCard.jsx"></script>
<script type="text/babel" data-type="module" src="./MetricCell.jsx"></script>
<script type="text/babel" data-type="module" src="./DataTable.jsx"></script>
<script type="text/babel" data-type="module" src="./TaskRow.jsx"></script>
<script type="text/babel" data-type="module" src="../layout/EmptyState.jsx"></script>
<style>body{padding:16px;background:var(--card)}.g{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;align-items:center}.k{font-size:12px;color:var(--muted-foreground)}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
const { KpiCard, MetricCell, DataTable, TaskRow, EmptyState } = await ready(["KpiCard","MetricCell","DataTable","TaskRow","EmptyState"]);
const cols = [
  { key:"name", label:"案件名", sticky:true, width:160, render:r=><a href="#" style={{color:"var(--primary)",fontWeight:500}}>{r.name}</a> },
  { key:"profit", label:"今週粗利", align:"right", sortable:true, render:r=><MetricCell value={r.profit} delta={r.dp} unit="¥"/> },
  { key:"roas", label:"ROAS", align:"right", sortable:true, render:r=><MetricCell value={r.roas} delta={r.dr} unit="%" digits={1} deltaUnit="pt"/> },
  { key:"spend", label:"消化", align:"right", sortable:true, render:r=><MetricCell value={r.spend} delta={r.ds} unit="¥"/> },
  { key:"cv", label:"CV", align:"right", render:r=><MetricCell value={r.cv} delta={r.dc}/> },
];
const rows = [
  { id:1, name:"A社 記事LP", profit:1204300, dp:120400, roas:311.7, dr:12.3, spend:8090909, ds:-38200, cv:412, dc:18 },
  { id:2, name:"B社 通販", profit:834900, dp:-52100, roas:188.2, dr:-4.1, spend:2210000, ds:150000, cv:96, dc:-7 },
  { id:3, name:"C社 紐付けCP", profit:null, roas:null, spend:null, cv:null },
];
function Sorted(){ const [s,setS]=React.useState({k:"profit",d:"desc"}); return <DataTable columns={cols} rows={rows} sortKey={s.k} sortDir={s.d} onSort={(k,d)=>setS({k,d})} minWidth={640}/>; }
const App = () => (
  <div className="g">
    <span className="k">KpiCard</span><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
      <KpiCard label="対象週 商材粗利" value="¥1,204,300" delta={{value:120400,prefix:"¥",digits:0}} note="先週比"/>
      <KpiCard label="対象週 ROAS" value="311.7" unit="%" delta={{value:-4.1,unit:"pt"}} note="先週 315.8%"/>
      <KpiCard label="対象週 CPA" value="¥3,120" delta={{value:8.2,unit:"%",invert:true}} note="下がると良い指標"/>
      <KpiCard label="対象週 CV" loading/>
    </div>
    <span className="k">MetricCell</span><div className="r" style={{gap:32,justifyContent:"flex-start"}}><MetricCell value={1204300} delta={120400} unit="¥"/><MetricCell value={311.7} delta={-4.1} unit="%" digits={1} deltaUnit="pt"/><MetricCell value={3120} delta={250} unit="¥" invert/><MetricCell value={412} delta={0}/><MetricCell value={null} empty="紐付けCP"/></div>
    <span className="k">DataTable sortable / sticky</span><div><Sorted/></div>
    <span className="k">loading / error / empty</span><div style={{display:"grid",gap:8}}>
      <DataTable columns={cols.slice(0,3)} rows={[]} loading/>
      <DataTable columns={cols.slice(0,3)} rows={[]} error="AXAD の集計に接続できません" onRetry={()=>{}}/>
      <DataTable columns={cols.slice(0,3)} rows={[]} emptyNode={<EmptyState compact icon="Table2" title="この週の案件データはまだありません。" description="対象週を変えるか、AXAD の同期をお待ちください。"/>}/>
    </div>
    <span className="k">TaskRow</span><div style={{display:"grid",gap:2,border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:4,background:"var(--card)"}}>
      <TaskRow text="A社 記事LP の CR 差し替え（型B → 型C）" assignee="白井" due="9/10" media="FB"/>
      <TaskRow text="B社 TikTok 新規 CPN の入札調整" assignee="井上" due="9/5" overdue media="TikTok"/>
      <TaskRow done text="週次レポートの施策コメント記入" assignee="髙仲" due="9/8"/>
      <TaskRow mode="edit" projects={["A社 記事LP","B社 通販"]} assignees={["白井","井上","髙仲"]} project="A社 記事LP"/>
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
