<script type="text/babel" data-type="module">
import { ready } from "../../assets/dvb-ready.js";
import { NAV_GROUPS, NAV_TO_SCREEN } from "./data.js";
const D = await ready(["Sidebar","Toast","Button","DataTable","TaskRow","KpiCard","PageHeader","FilterBar","Select","Field","Textarea","SaveStatus","EmptyState","SectionHeading","Badge","ConfirmDialog","MetricCell","Input","WeekSelector","FreshnessBadge","FreshnessNotice","DraftRestoreBanner","Progress","SegmentedControl","Dialog","Switch","Checkbox","Tabs","ChatPanel","LinkTile","SubNav","AuthCard"]);
const KIT = ["BoardScreen","ProjectScreen","MboScreen","WeeklyReportScreen","MboMobileScreen","MboHistoryScreen","MboMonthlyScreen","ProjectMobileScreen","GoalScreen","CommitScreen","DashboardScreen","TasksScreen","SectionDetailScreen","DashboardScreenV2","CommitScreenV2","EvaluationScreen","HitMeasuresScreen","KnowledgeScreen","BoardV2Screen","AnalyticsScreen","ShootingScheduleScreen","LinksScreen","ManualScreen","SettingsScreen","TrainingHomeScreen","TrainingScheduleScreen","TrainingLearningScreen","TrainingChecklistScreen","TrainingQuizScreen","TrainingValuesScreen","TrainingCrOutputScreen","TrainingGlossaryScreen","TrainingQaScreen","LoginScreen","RegisterScreen","AssigneeListScreen","AssigneeDetailScreen"];
await new Promise((r) => { const t = () => (window.DVBKit && KIT.every((k) => window.DVBKit[k])) ? r() : setTimeout(t, 16); t(); });
const { Sidebar, Toast } = D;
const K = window.DVBKit;
const { useState, useEffect } = React;
const L = window.LucideReact;

const S4 = [["normal","通常"],["empty","空"],["loading","読み込み"],["error","エラー"]];
const S2 = S4.slice(0, 2);
/** 上部バーの「画面」グループ（§5: 毎日 / 週次・ツール / 研修・外部 / 管理） */
const GROUPS = [["daily", "毎日"], ["weekly", "週次・ツール"], ["training", "研修・外部"], ["admin", "管理"]];
/** 画面定義: pc / mobile の部品と、それぞれの状態一覧。nav = サイドバーの現在地キー、group = 上部バーのグループ */
const SCREENS = [
  // 毎日（バッチ 1 で 4 画面追加。旧 Wave 2 ラフの dashboard / commit は *-rough に退避）
  { key: "dashboard", label: "ダッシュボード", group: "daily", nav: "dashboard", pc: K.DashboardScreenV2, pcStates: S4 },
  { key: "tasks", label: "タスク管理", group: "daily", nav: "tasks", pc: K.TasksScreen, pcStates: S4 },
  { key: "tasks-section", label: "課のタスク詳細", group: "daily", nav: "tasks", pc: K.SectionDetailScreen, pcStates: S2 },
  { key: "mbo", label: "日報", group: "daily", nav: "mbo", pc: K.MboScreen, pcStates: [...S4, ["sent","送信済み"]], mobile: K.MboMobileScreen, mobileStates: [...S2, ["sent","送信済み"], ["night","0〜5時"]] },
  { key: "mbo-history", label: "日報 履歴", group: "daily", nav: "mbo", pc: K.MboHistoryScreen, pcStates: S4, mobile: (p) => <K.MboHistoryScreen {...p} mobile />, mobileStates: S2 },
  { key: "mbo-monthly", label: "日報 月別", group: "daily", nav: "mbo", pc: K.MboMonthlyScreen, pcStates: S4 },
  { key: "commit", label: "コミットメント", group: "daily", nav: "commit", pc: K.CommitScreenV2, pcStates: S4 },
  { key: "dashboard-rough", label: "ダッシュボード（v1 ラフ）", group: "daily", nav: "dashboard", pc: K.DashboardScreen, pcStates: [S4[0]] },
  { key: "commit-rough", label: "コミットメント（v1 ラフ）", group: "daily", nav: "commit", pc: K.CommitScreen, pcStates: [S4[0]] },
  // 週次・ツール（バッチ 2 で 9 画面追加。旧 goal ラフは goal-rough に退避、board は v1 のまま残置）
  { key: "weekly", label: "週次レポート", group: "weekly", nav: "weekly", pc: K.WeeklyReportScreen, pcStates: [...S4, ["view","閲覧モード"]], mobile: (p) => <K.WeeklyReportScreen {...p} mobile />, mobileStates: S2 },
  { key: "project", label: "案件別まとめ", group: "weekly", nav: "project", pc: K.ProjectScreen, pcStates: S4, mobile: K.ProjectMobileScreen, mobileStates: S2 },
  { key: "board-v2", label: "先週比較・案件タスク", group: "weekly", nav: "project", pc: K.BoardV2Screen, pcStates: S4 },
  { key: "evaluation", label: "目標（評価シート）", group: "weekly", nav: "goal", pc: K.EvaluationScreen, pcStates: S4, mobile: (p) => <K.EvaluationScreen {...p} mobile />, mobileStates: [S4[0]] },
  { key: "hit", label: "ヒット施策", group: "weekly", nav: "hit", pc: K.HitMeasuresScreen, pcStates: S4 },
  { key: "knowledge", label: "検証ナレッジ", group: "weekly", nav: "knowledge", pc: K.KnowledgeScreen, pcStates: S4 },
  { key: "analytics", label: "分析", group: "weekly", nav: "analytics", pc: K.AnalyticsScreen, pcStates: S4 },
  { key: "shoot", label: "撮影スケジュール", group: "weekly", nav: "shoot", pc: K.ShootingScheduleScreen, pcStates: S4 },
  { key: "links", label: "リンク集", group: "weekly", nav: "links", pc: K.LinksScreen, pcStates: [S4[0], ["edit","編集モード"]] },
  { key: "manual", label: "マニュアル", group: "weekly", nav: "manual", pc: K.ManualScreen, pcStates: [S4[0], ["compact","目次 Dialog（lg 未満）"]] },
  { key: "settings", label: "設定", group: "weekly", nav: "settings", pc: K.SettingsScreen, pcStates: [S4[0], ["success","保存成功"], S4[3]] },
  { key: "board", label: "GG 週次案件ボード（v1）", group: "weekly", nav: "project", pc: K.BoardScreen, pcStates: S4 },
  { key: "goal", label: "目標（v1 ラフ）", group: "weekly", nav: "goal", pc: K.GoalScreen, pcStates: [S4[0]] },
  // 研修・外部（バッチ 3 で 13 画面追加。研修は SubNav 付きの全面再設計、ログイン・登録・アセクリは bare = サイドバーなしレイアウト）
  { key: "training-home", label: "研修 ホーム", group: "training", nav: "training", pc: K.TrainingHomeScreen, pcStates: S2, mobile: K.TrainingHomeScreen, mobileStates: S2 },
  { key: "training-schedule", label: "スケジュール", group: "training", nav: "training", pc: K.TrainingScheduleScreen, pcStates: S2 },
  { key: "training-learning", label: "学習リスト", group: "training", nav: "training", pc: K.TrainingLearningScreen, pcStates: S4 },
  { key: "training-checklist", label: "チェックリスト", group: "training", nav: "training", pc: K.TrainingChecklistScreen, pcStates: S2 },
  { key: "training-quiz", label: "理解度チェック", group: "training", nav: "training", pc: K.TrainingQuizScreen, pcStates: [S4[0]] },
  { key: "training-values", label: "バリュー振り返り", group: "training", nav: "training", pc: K.TrainingValuesScreen, pcStates: S2 },
  { key: "training-cr", label: "CRアウトプット", group: "training", nav: "training", pc: K.TrainingCrOutputScreen, pcStates: S2 },
  { key: "training-glossary", label: "用語集", group: "training", nav: "training", pc: K.TrainingGlossaryScreen, pcStates: [S4[0]] },
  { key: "training-qa", label: "Q&A", group: "training", nav: "training", pc: K.TrainingQaScreen, pcStates: S4, mobile: K.TrainingQaScreen, mobileStates: S4 },
  { key: "login", label: "ログイン", group: "training", nav: "dashboard", bare: true, pc: K.LoginScreen, pcStates: [S4[0], S4[3]], mobile: K.LoginScreen, mobileStates: [S4[0], S4[3]] },
  { key: "register", label: "登録申請", group: "training", nav: "dashboard", bare: true, pc: K.RegisterScreen, pcStates: [S4[0], ["success","申請完了"], S4[3]], mobile: K.RegisterScreen, mobileStates: [S4[0], ["success","申請完了"], S4[3]] },
  { key: "assignee", label: "アセクリ 一覧", group: "training", nav: "dashboard", bare: true, pc: K.AssigneeListScreen, pcStates: [S4[0], S4[1], ["denied","アクセス拒否"]] },
  { key: "assignee-detail", label: "アセクリ 詳細", group: "training", nav: "dashboard", bare: true, pc: K.AssigneeDetailScreen, pcStates: S4, mobile: K.AssigneeDetailScreen, mobileStates: S4 },
  // 管理 はバッチ 4
];
const WIDTHS = [1440, 1280, 393, 430];
const parse = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const USER = { name: "髙仲 秀介", role: "リーダー" };

function App() {
  const q = parse();
  const [screen, setScreen] = useState(SCREENS.some((s) => s.key === q.screen) ? q.screen : "weekly");
  const [state, setState] = useState(q.state || "normal");
  const [width, setWidth] = useState(WIDTHS.includes(Number(q.w)) ? Number(q.w) : 1440);
  const [collapsed, setCollapsed] = useState(q.nav === "min");
  const [menu, setMenu] = useState(false);
  const [toasts, setToasts] = useState([]);
  useEffect(() => { location.hash = new URLSearchParams({ screen, state, w: width, nav: collapsed ? "min" : "full" }).toString(); }, [screen, state, width, collapsed]);
  useEffect(() => { const h = () => { const q = parse(); if (q.screen && q.screen !== screen) setScreen(q.screen); if (q.state && q.state !== state) setState(q.state); if (q.w && Number(q.w) !== width) setWidth(Number(q.w)); if (q.nav) setCollapsed(q.nav === "min"); }; window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, [screen, state, width, collapsed]);
  const toast = (t) => { const id = Date.now() + Math.random(); setToasts((ts) => [...ts.slice(-2), { ...t, id }]); if (t.kind !== "error") setTimeout(() => setToasts((ts) => ts.filter((x) => x.id !== id)), t.kind === "undo" ? 6000 : 3000); };
  const close = (id) => setToasts((ts) => ts.filter((x) => x.id !== id));

  const mobile = width < 600;
  const def = SCREENS.find((s) => s.key === screen);
  const supported = mobile ? !!def.mobile : true;
  const states = mobile ? (def.mobileStates || []) : def.pcStates;
  const st = states.some((s) => s[0] === state) ? state : "normal";
  const Screen = mobile ? def.mobile : def.pc;
  const narrow = width === 1280;
  const navigate = (k) => { const s = NAV_TO_SCREEN[k] || (SCREENS.some((x) => x.key === k) ? k : null); if (s) { setScreen(s); setMenu(false); } else toast({ kind: "info", message: "このキットには含まれない画面です" }); };
  const toastNodes = toasts.map((t) => <Toast key={t.id} kind={t.kind} message={t.message} actionLabel={t.actionLabel} onAction={() => { t.onAction && t.onAction(); close(t.id); }} onClose={() => close(t.id)} style={mobile ? { width: "auto" } : undefined} />);
  const Menu = L.Menu;

  return (
    <>
      <div className="bar" role="toolbar" aria-label="キット操作">
        <span style={{fontWeight:600,fontSize:13}}>DVB リファレンス</span>
        {GROUPS.map(([g, gl]) => { const list = SCREENS.filter((s) => s.group === g); return (<React.Fragment key={g}>
          <span className="lbl">{gl}</span>
          <div className="grp">{list.length ? list.map((s) => <button key={s.key} aria-pressed={screen===s.key} onClick={() => setScreen(s.key)} disabled={mobile && !s.mobile} title={mobile && !s.mobile ? "PC 幅のみ" : undefined}>{s.label}</button>) : <button disabled title="後のバッチで追加">—</button>}</div>
        </React.Fragment>); })}
        <span className="lbl">状態</span><div className="grp">{states.map(([k,l]) => <button key={k} aria-pressed={st===k} onClick={() => setState(k)}>{l}</button>)}</div>
        <span className="lbl">幅</span><div className="grp">{WIDTHS.map((w) => <button key={w} aria-pressed={width===w} onClick={() => { setWidth(w); if (w < 600 && !def.mobile) setScreen("mbo"); }}>{w}</button>)}</div>
        {!mobile ? <><span className="lbl">ナビ</span><div className="grp"><button aria-pressed={!collapsed} onClick={() => setCollapsed(false)}>248</button><button aria-pressed={collapsed} onClick={() => setCollapsed(true)}>56</button></div></> : null}
      </div>

      {def.bare ? (
        /* バッチ 3: サイドバーなしレイアウト（ログイン・登録・アセクリ）。画面が自分のヘッダ／中央寄せを描く */
        <div style={{ width, height: mobile ? 852 : undefined, minHeight: mobile ? undefined : 860, margin: "16px auto", background: "var(--background)", display: "flex", flexDirection: "column", boxShadow: "0 0 0 1px oklch(0 0 0 / .08)", fontFamily: "var(--font-sans)", color: "var(--foreground)", position: "relative", overflow: mobile ? "hidden" : "visible", borderRadius: mobile ? 12 : 0 }}>
          <Screen key={screen + st + width} state={st} toast={toast} mobile={mobile} narrow={narrow} onNavigate={navigate} />
          <div aria-live="polite" style={mobile ? { position: "absolute", left: 16, right: 16, bottom: 24, display: "flex", flexDirection: "column", gap: 8, zIndex: 60, pointerEvents: "none" } : { position: "fixed", right: 24, bottom: 24, display: "flex", flexDirection: "column", gap: 8, zIndex: 60 }}>{toastNodes}</div>
        </div>
      ) : mobile ? (
        <div style={{ width, height: 852, margin: "16px auto", background: "var(--background)", display: "flex", flexDirection: "column", boxShadow: "0 0 0 1px oklch(0 0 0 / .08)", fontFamily: "var(--font-sans)", color: "var(--foreground)", position: "relative", overflow: "hidden", borderRadius: 12 }}>
          <header style={{ height: 56, display: "flex", alignItems: "center", gap: 4, padding: "0 8px 0 4px", background: "var(--card)", borderBottom: "1px solid var(--border)", flexShrink: 0 }}>
            <button type="button" aria-label="メニュー" onClick={() => setMenu(true)} style={{ width: 44, height: 44, display: "grid", placeItems: "center", border: 0, background: "transparent", color: "var(--foreground)", borderRadius: "var(--radius-sm)", cursor: "pointer" }}><Menu size={22} strokeWidth={1.75} /></button>
            <span style={{ fontSize: 17, fontWeight: 700, letterSpacing: "0.04em" }}>AXIS</span>
            <span style={{ marginLeft: "auto", fontSize: 13, color: "var(--muted-foreground)", fontVariantNumeric: "tabular-nums" }}>9/9 (火) 15:56</span>
          </header>
          <main style={{ flex: 1, minHeight: 0, overflow: "auto", padding: "16px 16px 0", display: "flex", flexDirection: "column" }}>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", paddingBottom: screen === "mbo" ? 0 : 16 }}>
            {supported ? <Screen key={screen + st + width} state={st} toast={toast} mobile onNavigate={navigate} /> : <div style={{ padding: 24, textAlign: "center", color: "var(--muted-foreground)", fontSize: 14 }}>この画面は PC 幅のみです。</div>}
            </div>
          </main>
          <Sidebar drawer open={menu} onClose={() => setMenu(false)} groups={NAV_GROUPS} activeKey={def.nav} onSelect={navigate} user={USER} onSettings={() => toast({ kind: "info", message: "設定を開く" })} />
          <div aria-live="polite" style={{ position: "absolute", left: 16, right: 16, bottom: 96, display: "flex", flexDirection: "column", gap: 8, zIndex: 60, pointerEvents: "none" }}>{toastNodes}</div>
        </div>
      ) : (
        <div style={{ width, margin: "16px auto", background: "var(--background)", display: "flex", minHeight: 860, boxShadow: "0 0 0 1px oklch(0 0 0 / .08)", fontFamily: "var(--font-sans)", color: "var(--foreground)", position: "relative" }}>
          <Sidebar groups={NAV_GROUPS} activeKey={def.nav} onSelect={navigate} collapsed={collapsed} onToggle={() => setCollapsed(!collapsed)} date="9/9 (火)" time="15:56" user={USER} onSettings={() => toast({ kind: "info", message: "設定を開く" })} height="auto" style={{ position: "sticky", top: 40, alignSelf: "flex-start", height: 860 }} />
          <main style={{ flex: 1, minWidth: 0, padding: 24 }}>
            <Screen key={screen + st + width} state={st} toast={toast} narrow={narrow} onNavigate={navigate} />
          </main>
          <div aria-live="polite" style={{ position: "fixed", right: 24, bottom: 24, display: "flex", flexDirection: "column", gap: 8, zIndex: 60 }}>{toastNodes}</div>
        </div>
      )}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
